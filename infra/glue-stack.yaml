AWSTemplateFormatVersion: '2010-09-09'
Description: Minimal AWS Glue web access-log analytics project (S3, crawler, Data Catalog, one Spark job).

Parameters:
  ExistingBucketName:
    Type: String
    Description: Existing S3 bucket created by infra/deploy.ps1.
  ProjectPrefix:
    Type: String
    Default: web-log-analytics
    Description: Prefix used for the project folders inside the bucket.
  GlueWorkerType:
    Type: String
    Default: G.1X
    AllowedValues: [G.1X, G.2X]
  NumberOfWorkers:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 10

Resources:
  GlueServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-glue-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: WebLogProjectS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListProjectBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ExistingBucketName}'
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub '${ProjectPrefix}/*'
                      - !Sub '${ProjectPrefix}'
              - Sid: ReadWriteProjectObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ExistingBucketName}/${ProjectPrefix}/*'

  WebLogCatalogDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: web_log_analytics_catalog
        Description: Glue Data Catalog database for raw web access logs.

  WebLogCsvClassifier:
    Type: AWS::Glue::Classifier
    Properties:
      CsvClassifier:
        Name: !Sub '${AWS::StackName}-csv-classifier'
        ContainsHeader: PRESENT
        Delimiter: ','
        QuoteSymbol: '"'
        Serde: OpenCSVSerDe
        Header:
          - event_id
          - event_time
          - client_ip
          - method
          - path
          - status_code
          - response_time_ms
          - bytes_sent
          - user_agent
          - referer

  WebLogCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub '${AWS::StackName}-crawler'
      Role: !GetAtt GlueServiceRole.Arn
      DatabaseName: !Ref WebLogCatalogDatabase
      TablePrefix: raw_
      Classifiers:
        - !Ref WebLogCsvClassifier
      Targets:
        S3Targets:
          - Path: !Sub 's3://${ExistingBucketName}/${ProjectPrefix}/raw/access_logs/'
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG
      RecrawlPolicy:
        RecrawlBehavior: CRAWL_NEW_FOLDERS_ONLY

  WebLogEtlJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${AWS::StackName}-etl'
      Role: !GetAtt GlueServiceRole.Arn
      GlueVersion: '6.0'
      WorkerType: !Ref GlueWorkerType
      NumberOfWorkers: !Ref NumberOfWorkers
      Timeout: 20
      MaxRetries: 0
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !Sub 's3://${ExistingBucketName}/${ProjectPrefix}/scripts/glue_web_log_etl.py'
      DefaultArguments:
        '--job-language': python
        '--job-bookmark-option': job-bookmark-enable
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--enable-job-insights': 'true'
        '--TempDir': !Sub 's3://${ExistingBucketName}/${ProjectPrefix}/temp/'
        '--CATALOG_DATABASE': !Ref WebLogCatalogDatabase
        '--CATALOG_TABLE': raw_access_logs
        '--OUTPUT_BUCKET': !Ref ExistingBucketName
        '--OUTPUT_PREFIX': !Sub '${ProjectPrefix}/processed'

Outputs:
  BucketName:
    Description: Existing S3 bucket used by the project.
    Value: !Ref ExistingBucketName
  ProjectPrefix:
    Description: S3 prefix used by the project.
    Value: !Ref ProjectPrefix
  GlueDatabaseName:
    Value: !Ref WebLogCatalogDatabase
  GlueCrawlerName:
    Value: !Ref WebLogCrawler
  GlueJobName:
    Value: !Ref WebLogEtlJob
  GlueRoleArn:
    Value: !GetAtt GlueServiceRole.Arn
